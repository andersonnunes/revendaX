name: CI - gateway

on:
  pull_request:
    paths:
      - "src/Gateway/**"
      - "tests/Gateway.Tests/**"
      - "revendaX.slnx"
      - "global.json"
      - ".github/workflows/ci-gateway.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Gateway/Gateway.csproj

      - name: Build
        run: dotnet build src/Gateway/Gateway.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/Gateway.Tests/Gateway.Tests.csproj -c Release

      - name: Build Docker image
        run: docker build -f src/Gateway/Dockerfile -t gateway:ci .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: gateway:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
