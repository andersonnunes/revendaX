name: CI - identity-api

on:
  pull_request:
    paths:
      - "src/IdentityApi/**"
      - "tests/IdentityApi.Tests/**"
      - "revendaX.slnx"
      - "global.json"
      - ".github/workflows/ci-identity-api.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/IdentityApi/IdentityApi.csproj

      - name: Build
        run: dotnet build src/IdentityApi/IdentityApi.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/IdentityApi.Tests/IdentityApi.Tests.csproj -c Release

      - name: Build Docker image
        run: docker build -f src/IdentityApi/Dockerfile -t identity-api:ci .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: identity-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
