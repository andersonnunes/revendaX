name: CI - identity-api

# Sem "paths:" no trigger — o job roda em todo PR, para sempre reportar um status check
# (required em branch protection não pode depender de path, senão PRs que não tocam este
# serviço ficam travados esperando um check que nunca dispara). O filtro de path abaixo só
# decide se o trabalho pesado (build/test/scan) roda ou é pulado.
on:
  pull_request:

jobs:
  build-test-identity-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - "src/IdentityApi/**"
              - "src/IdentityApi.Domain/**"
              - "src/IdentityApi.Application/**"
              - "src/IdentityApi.Infrastructure/**"
              - "tests/IdentityApi.Tests/**"
              - "tests/IdentityApi.Domain.Tests/**"
              - "infra/keycloak/realm-clientes.json"
              - "revendaX.slnx"
              - "global.json"
              - ".github/workflows/ci-identity-api.yml"

      - uses: actions/setup-dotnet@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet restore src/IdentityApi/IdentityApi.csproj

      - name: Lint (dotnet format)
        if: steps.filter.outputs.relevant == 'true'
        run: |
          dotnet format src/IdentityApi/IdentityApi.csproj --verify-no-changes
          dotnet format src/IdentityApi.Domain/IdentityApi.Domain.csproj --verify-no-changes
          dotnet format src/IdentityApi.Application/IdentityApi.Application.csproj --verify-no-changes
          dotnet format src/IdentityApi.Infrastructure/IdentityApi.Infrastructure.csproj --verify-no-changes

      - name: Build
        if: steps.filter.outputs.relevant == 'true'
        run: dotnet build src/IdentityApi/IdentityApi.csproj --no-restore -c Release

      # Threshold de cobertura (80%, linhas) via coverlet.msbuild — falha o `dotnet test` (exit
      # code != 0) se ficar abaixo. `ExcludeByFile` tira código gerado (ex.: glue do Scalar/
      # OpenAPI em obj/), que senão distorce o número pra baixo sem refletir lógica não testada.
      - name: Test (Domain — unitário)
        if: steps.filter.outputs.relevant == 'true'
        run: >
          dotnet test tests/IdentityApi.Domain.Tests/IdentityApi.Domain.Tests.csproj -c Release
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
          /p:ExcludeByFile="**/obj/**/*.cs"
          /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=total

      - name: Test (integração — Keycloak real via Testcontainers)
        if: steps.filter.outputs.relevant == 'true'
        run: >
          dotnet test tests/IdentityApi.Tests/IdentityApi.Tests.csproj -c Release
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
          /p:ExcludeByFile="**/obj/**/*.cs"
          /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=total

      - name: Build Docker image
        if: steps.filter.outputs.relevant == 'true'
        run: docker build -f src/IdentityApi/Dockerfile -t identity-api:ci .

      - name: Scan image (Trivy)
        if: steps.filter.outputs.relevant == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: identity-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
