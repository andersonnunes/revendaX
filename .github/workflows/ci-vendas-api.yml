name: CI - vendas-api

on:
  pull_request:
    paths:
      - "src/VendasApi/**"
      - "tests/VendasApi.Tests/**"
      - "revendaX.slnx"
      - "global.json"
      - ".github/workflows/ci-vendas-api.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/VendasApi/VendasApi.csproj

      - name: Build
        run: dotnet build src/VendasApi/VendasApi.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/VendasApi.Tests/VendasApi.Tests.csproj -c Release

      - name: Build Docker image
        run: docker build -f src/VendasApi/Dockerfile -t vendas-api:ci .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: vendas-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
