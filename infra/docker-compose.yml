# Ambiente de desenvolvimento local. Rodar a partir da raiz do repositório:
#   docker compose -f infra/docker-compose.yml up --build
#
# Ponto de entrada único pra API: gateway (porta 8080), que roteia /identity/** para
# identity-api e /vendas/** para vendas-api (YARP, ver src/Gateway/appsettings.json).
# identity-api e vendas-api também têm porta própria exposta, só para debug direto sem passar
# pelo gateway. O frontend bônus (porta 8082, Épico 4) fala com o gateway pra API e direto com
# o Keycloak pra login (Authorization Code + PKCE) — não passa pelo gateway pra autenticar.
#
# O Keycloak sobe com o realm `clientes` importado automaticamente
# (infra/keycloak/realm-clientes.json) — client `identity-api` (confidencial, service account
# com manage-users), client público `vendas-frontend` (ROPC pra testes/vídeo + Authorization
# Code + PKCE pro frontend real, US4.1), role `cliente` (default role) e os user attributes
# customizados (cpf, telefone) já configurados.
#
# IMPORTANTE: o Keycloak só reimporta esse arquivo se o realm ainda não existir no Postgres
# dele (keycloak-db-data). Depois de editar o realm, use `docker compose down -v` antes do
# próximo `up` — senão a mudança é ignorada silenciosamente (o volume persiste a versão
# antiga).
name: revendax

services:
  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      - identity-api
      - vendas-api

  # Frontend bônus (Épico 4) — Blazor WebAssembly, servido como estático via nginx. Fala
  # direto com o Keycloak (login) e com o gateway (API), nunca com identity-api/vendas-api
  # diretamente — mesma regra de "porta única de entrada" do resto do projeto.
  frontend:
    build:
      context: ..
      dockerfile: src/Frontend/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      - gateway

  identity-api:
    build:
      context: ..
      dockerfile: src/IdentityApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__BaseUrl=http://keycloak:8080
      - Keycloak__Realm=clientes
      - Keycloak__ClientId=identity-api
      # Secret de desenvolvimento fixo, definido no próprio realm-clientes.json commitado —
      # mesmo padrão já aceito para o admin do Keycloak (admin/admin) e o usuário vendedor
      # (US1.5): ambiente local efêmero, não é segredo de produção.
      - Keycloak__ClientSecret=dev-identity-api-secret
    ports:
      - "5081:8080" # exposta à parte para debug direto; o acesso "oficial" é via gateway
    depends_on:
      - keycloak

  vendas-api:
    build:
      context: ..
      dockerfile: src/VendasApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__BaseUrl=http://keycloak:8080
      # Credenciais de dev do próprio vendas-db definido abaixo — mesmo padrão já aceito para
      # o admin do Keycloak e o client secret do identity-api (ambiente local efêmero).
      - ConnectionStrings__VendasDb=Host=vendas-db;Port=5432;Database=vendas;Username=vendas;Password=vendas
      # Segredo de dev do webhook de confirmação de pagamento (US3.3) — mesmo padrão dos demais
      # segredos de ambiente local efêmero acima.
      - Pagamentos__WebhookSecret=dev-webhook-secret
    ports:
      - "5082:8080" # exposta à parte para debug direto; o acesso "oficial" é via gateway
    depends_on:
      keycloak:
        condition: service_started
      vendas-db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      # Fixa o hostname que o Keycloak usa pra se descrever (claim `iss` dos tokens, US1.3, e
      # todo link/URL que ele mesmo gera — página de login, e-mail de redefinição de senha,
      # US1.4). Aponta pro endereço que o NAVEGADOR enxerga (localhost:8081), não pro hostname
      # interno do Docker — corrigido na US4.1 (frontend bônus), quando o primeiro fluxo a
      # exigir o navegador abrindo uma página *hospedada pelo Keycloak* (login via
      # Authorization Code, não só POST direto no /token via ROPC) expôs que apontar pro
      # hostname interno (`keycloak:8080`) deixava a própria página de login com um
      # `action="http://keycloak:8080/..."` que o navegador do usuário não resolve — o mesmo
      # problema, menos visível, já existia pro link de redefinição de senha da US1.4 (por
      # isso aquela história documentava um workaround manual, hoje desnecessário).
      #
      # `identity-api`/`vendas-api` continuam alcançando o Keycloak pelo hostname interno
      # (`Keycloak__BaseUrl=http://keycloak:8080`, only reachable dentro da rede do Docker) —
      # isso não muda. O que muda é só a identidade que o Keycloak *declara ter*: a validação
      # de token não compara contra o endereço usado pra buscar o JWKS/metadata (`Authority`),
      # compara contra o `issuer` que o próprio documento de metadata reporta — que passa a
      # ser `http://localhost:8081/realms/clientes`, batendo com o que os tokens de verdade
      # carregam, já que ambos vêm do mesmo `KC_HOSTNAME`.
      - KC_HOSTNAME=http://localhost:8081
      # Sem isso, o *documento de metadata* (`.well-known/openid-configuration`) também
      # reportaria `jwks_uri`/`token_endpoint`/etc. fixados em `localhost:8081` pra qualquer
      # chamador — inclusive pro `vendas-api`, que busca esse documento pelo hostname interno
      # (`keycloak:8080`) mas não consegue depois alcançar `localhost:8081` (de dentro do
      # container, isso é o próprio container, não o host) pra buscar as chaves JWKS de fato.
      # `true` faz o Keycloak resolver esses endpoints "de canal de retorno" dinamicamente, a
      # partir do endereço que cada chamador de fato usou — o `issuer` continua fixo em
      # `KC_HOSTNAME` (é o que precisa ser estável pra validação bater), só os endpoints
      # operacionais viram dinâmicos.
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HOSTNAME_STRICT=true
    volumes:
      - ./keycloak/realm-clientes.json:/opt/keycloak/data/import/realm-clientes.json:ro
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # SMTP fake para dev/demonstração (US1.4) — o realm `clientes` está configurado para
  # enviar e-mail de redefinição de senha via este serviço (host "mailpit", porta 1025), não
  # um provedor real. UI + API de inspeção: http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  keycloak-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  vendas-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=vendas
      - POSTGRES_USER=vendas
      - POSTGRES_PASSWORD=vendas
    volumes:
      - vendas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keycloak-db-data:
  vendas-db-data:
