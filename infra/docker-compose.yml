# Ambiente de desenvolvimento local. Rodar a partir da raiz do repositório:
#   docker compose -f infra/docker-compose.yml up --build
#
# Ponto de entrada único: gateway (porta 8080), que roteia /identity/** para identity-api e
# /vendas/** para vendas-api (YARP, ver src/Gateway/appsettings.json). identity-api e
# vendas-api também têm porta própria exposta, só para debug direto sem passar pelo gateway.
#
# O Keycloak sobe com o realm `clientes` importado automaticamente
# (infra/keycloak/realm-clientes.json) — client `identity-api` (confidencial, service account
# com manage-users), client público `vendas-frontend` (login via ROPC), role `cliente`
# (default role) e os user attributes customizados (cpf, telefone) já configurados.
#
# IMPORTANTE: o Keycloak só reimporta esse arquivo se o realm ainda não existir no Postgres
# dele (keycloak-db-data). Depois de editar o realm, use `docker compose down -v` antes do
# próximo `up` — senão a mudança é ignorada silenciosamente (o volume persiste a versão
# antiga).
name: revendax

services:
  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      - identity-api
      - vendas-api

  identity-api:
    build:
      context: ..
      dockerfile: src/IdentityApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__BaseUrl=http://keycloak:8080
      - Keycloak__Realm=clientes
      - Keycloak__ClientId=identity-api
      # Secret de desenvolvimento fixo, definido no próprio realm-clientes.json commitado —
      # mesmo padrão já aceito para o admin do Keycloak (admin/admin) e o usuário vendedor
      # (US1.5): ambiente local efêmero, não é segredo de produção.
      - Keycloak__ClientSecret=dev-identity-api-secret
    ports:
      - "5081:8080" # exposta à parte para debug direto; o acesso "oficial" é via gateway
    depends_on:
      - keycloak

  vendas-api:
    build:
      context: ..
      dockerfile: src/VendasApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__BaseUrl=http://keycloak:8080
      # Credenciais de dev do próprio vendas-db definido abaixo — mesmo padrão já aceito para
      # o admin do Keycloak e o client secret do identity-api (ambiente local efêmero).
      - ConnectionStrings__VendasDb=Host=vendas-db;Port=5432;Database=vendas;Username=vendas;Password=vendas
      # Segredo de dev do webhook de confirmação de pagamento (US3.3) — mesmo padrão dos demais
      # segredos de ambiente local efêmero acima.
      - Pagamentos__WebhookSecret=dev-webhook-secret
    ports:
      - "5082:8080" # exposta à parte para debug direto; o acesso "oficial" é via gateway
    depends_on:
      keycloak:
        condition: service_started
      vendas-db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      # Fixa o hostname usado no claim `iss` dos tokens (US1.3) — sem isso, o Keycloak calcula
      # o issuer a partir do host:porta que cada chamador usou pra logar (ex.: localhost:8081
      # do host), mas o vendas-api valida via hostname interno do Docker (keycloak:8080); os
      # dois nunca bateriam, e todo token seria rejeitado com "issuer inválido".
      - KC_HOSTNAME=http://keycloak:8080
      - KC_HOSTNAME_STRICT=true
    volumes:
      - ./keycloak/realm-clientes.json:/opt/keycloak/data/import/realm-clientes.json:ro
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # SMTP fake para dev/demonstração (US1.4) — o realm `clientes` está configurado para
  # enviar e-mail de redefinição de senha via este serviço (host "mailpit", porta 1025), não
  # um provedor real. UI + API de inspeção: http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  keycloak-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  vendas-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=vendas
      - POSTGRES_USER=vendas
      - POSTGRES_PASSWORD=vendas
    volumes:
      - vendas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keycloak-db-data:
  vendas-db-data:
