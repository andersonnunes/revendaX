# Postgres dedicado ao Keycloak — mesma imagem/credenciais do docker-compose atual.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: revendax
type: Opaque
stringData:
  # Mesmo padrão já aceito no docker-compose pra todo segredo de ambiente local efêmero —
  # trocar "environment:" por Secret do Kubernetes não muda o risco real, só o mecanismo.
  POSTGRES_PASSWORD: keycloak

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-db-data
  namespace: revendax
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-db
  namespace: revendax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-db
  strategy:
    type: Recreate # um único PVC ReadWriteOnce — não faz sentido rolar 2 réplicas nem por um instante
  template:
    metadata:
      labels:
        app: keycloak-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-db-data

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
  namespace: revendax
spec:
  selector:
    app: keycloak-db
  ports:
    - port: 5432
      targetPort: 5432
