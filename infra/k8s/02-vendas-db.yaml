# Postgres dedicado ao vendas-api — mesma imagem/credenciais do docker-compose atual.
apiVersion: v1
kind: Secret
metadata:
  name: vendas-db-secret
  namespace: revendax
type: Opaque
stringData:
  POSTGRES_PASSWORD: vendas

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vendas-db-data
  namespace: revendax
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendas-db
  namespace: revendax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vendas-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vendas-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: vendas
            - name: POSTGRES_USER
              value: vendas
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vendas-db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vendas"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "vendas"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vendas-db-data

---
apiVersion: v1
kind: Service
metadata:
  name: vendas-db
  namespace: revendax
spec:
  selector:
    app: vendas-db
  ports:
    - port: 5432
      targetPort: 5432
