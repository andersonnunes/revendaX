# SMTP fake pra dev/demonstração — o realm importado pelo Keycloak já aponta o envio de
# e-mail de redefinição de senha pro host "mailpit", porta 1025 (SMTP); a porta 8025 é só a
# UI/API de inspeção pra um humano abrir no navegador.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: revendax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  # Mesmo motivo do keycloak (ver comentário lá): hostPort (8025) num único node não convive
  # com RollingUpdate tentando manter o pod velho e o novo de pé ao mesmo tempo.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
              hostPort: 8025 # extraPortMappings do kind (infra/terraform/cluster.tf)
          readinessProbe:
            tcpSocket:
              port: 8025
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: revendax
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
