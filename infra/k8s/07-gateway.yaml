# Porta única de entrada do cluster (mesma regra do docker-compose) — hostPort bate com o
# extraPortMappings do kind (infra/terraform/cluster.tf), então http://localhost:8080/...
# continua funcionando sem trocar nenhum exemplo já documentado no README.
#
# O roteamento do YARP (src/Gateway/appsettings.json) já aponta pros hostnames
# "identity-api"/"vendas-api" — os Services deste diretório resolvem exatamente por esses
# nomes via DNS do cluster, então não precisa de nenhuma variável de ambiente sobrescrevendo
# destino aqui (mesmo appsettings.json de sempre, sem edição).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: revendax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  # Mesmo motivo do keycloak (ver comentário lá): hostPort (8080) num único node não convive
  # com RollingUpdate tentando manter o pod velho e o novo de pé ao mesmo tempo.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: localhost:5000/gateway:dev
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
          ports:
            - containerPort: 8080
              hostPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: revendax
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
