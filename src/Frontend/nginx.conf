server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly é uma SPA — rotas como /cadastro ou /authentication/login só
    # existem no roteador do próprio Blazor, não como arquivos físicos. Sem o fallback pro
    # index.html, um F5 (recarregar) em qualquer rota que não seja "/" devolveria 404 do
    # nginx antes mesmo do Blazor carregar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .wasm e .html precisam do Content-Type correto (senão o navegador baixa em vez de
    # renderizar). O nginx:alpine já resolve isso via mime.types (incluído por padrão no
    # http{} da imagem) — NÃO declarar um bloco `types {}` aqui: dentro de server{}/location{}
    # ele *substitui* o mapa inteiro em vez de complementá-lo, quebrando todo tipo que não
    # for listado explicitamente (foi exatamente o bug: só .wasm ficava mapeado, e até
    # index.html passava a vir como application/octet-stream).

    # Sem Cache-Control explícito, o navegador aplica cache heurístico baseado só em
    # Last-Modified e pode reusar uma cópia velha sem sequer revalidar. Pra Blazor isso é mais
    # grave que o normal: `index.html` embute inline os nomes com hash de conteúdo de cada
    # arquivo em `_framework/` (dotnet.js, blazor.webassembly.js etc.) — um `index.html` velho
    # em cache aponta pra hashes que não existem mais depois de um rebuild (a imagem é
    # reconstruída do zero, não incrementalmente), o navegador toma 404 ao buscá-los, e isso
    # aparece como erro real de inicialização do WASM (`#blazor-error-ui`), não só uma tela
    # desatualizada.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /css/ {
        add_header Cache-Control "no-cache";
    }
    location = /appsettings.json {
        add_header Cache-Control "no-cache";
    }

    # Arquivos em _framework/ (e demais estáticos versionados pelo build, ex.: ícones) têm o
    # hash do conteúdo no próprio nome — mudou o conteúdo, muda o nome. Por isso podem ficar em
    # cache "para sempre" com segurança: o navegador só reaproveita a URL certa se o conteúdo
    # for exatamente o mesmo.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
