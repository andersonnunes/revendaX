server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly é uma SPA — rotas como /cadastro ou /authentication/login só
    # existem no roteador do próprio Blazor, não como arquivos físicos. Sem o fallback pro
    # index.html, um F5 (recarregar) em qualquer rota que não seja "/" devolveria 404 do
    # nginx antes mesmo do Blazor carregar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .wasm precisa do MIME type correto — o nginx:alpine já reconhece via mime.types, mas
    # fica explícito aqui pra não depender de heurística caso a imagem base mude.
    types {
        application/wasm wasm;
    }
}
